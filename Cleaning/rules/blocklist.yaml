# 后处理黑名单
#
# 作用：抽取阶段的残余噪声在这里收敛。prompt 负责"尽量抽对"，本表负责"确定性剔除"。
# 为什么需要它：8B 在「对象词 / 领域词 / 指标词」上的判别不稳定，加规则边际收益递减，
#              而规则表可审计、可 diff、可增量维护，不受模型版本影响。
# 执行时机：抽取 → alias_map 归一 → 本表过滤 → 统计
# action: drop = 从结果中删除；flag = 保留在结果中但打标，人工抽检时优先看

mode:
  match: exact                 # 精确匹配（归一化后比较），不用子串，避免误伤（"大模型" vs "大模型应用"）
  normalize_before_match: true # 先按 alias_map 的 match 规则统一大小写与空格

categories:

  行业与领域名:
    action: drop
    reason: 领域名不是技能，但 JD 里几乎每篇都出现，不拦会直接冲上频次榜
    terms:
      - 自动驾驶
      - 机器人导航
      - 具身智能
      - 人工智能
      - 互联网
      - 金融
      - 电商
      - 半导体
      - 智能制造
      - 智慧城市
      - 工业互联网

  考核指标与规范:
    action: drop
    reason: 属绩效与质量要求，不是岗位能力
    terms:
      - 标注准确率
      - 合格率
      - 标注规范
      - 质量标准
      - 交付周期
      - 出勤率
      - 良率
      - KPI
      - SLA
      - 转化率
      - DAU
      - 业务指标

  品牌与产品名:
    action: drop
    reason: 品牌不是技能；工具类技能应落在通用名上（022 把机器人品牌 ABB/发那科/安川 整套抽了进去）
    terms:
      - ChatGPT
      - Claude
      - ABB
      - 发那科
      - 安川

  经历与背景:
    action: drop
    reason: "我会校园学生会"不成立——经历描述不是技能
    terms:
      - 校园学生会
      - 社团经验
      - 社会实践经验

  工作任务与动作:
    action: drop
    reason: 岗位职责里"要做的事"（014 开门/数据检查、027 分类/更新/对接、029 市场分配）
    terms:
      - 开门
      - 数据检查
      - 分类
      - 更新
      - 对接
      - 市场分配
      - 保密协议

  平台标签噪声:
    action: drop
    reason: 来自平台 showSkills 字段的招聘卖点，不是技能（v1 阶段污染标签的元凶）
    terms:
      - 工作简单
      - 可带手机
      - 五险一金
      - 包吃包住
      - 双休
      - 不加班
      - 长白班
      - 轻松
      - 稳定

  实物与奖励:
    action: drop
    reason: 福利品、奖品、节假日，与岗位能力完全无关（3yxz-019 一次混入 10+ 项）
    terms:
      - 冰箱
      - 微波炉
      - 水果
      - 零食下午茶
      - 节日福利
      - 生日福利
      - 每月奖金
      - 国家法定节假日
      - 心意礼品
      - 定期活动
      - 奖状奖杯奖金奖品
      - 团建活动

  协作对象与人/部门:
    action: drop
    reason: "我会客户"不成立——这些是协作/服务的对象，不是技能
    terms:
      - 客户
      - 用户
      - 技术团队
      - 供应链
      - 候选人

  空泛能力修饰语:
    action: drop
    reason: "我会解决方法"不成立——去掉"能力/方法/习惯"后没有具体指向，是态度描述不是技能
    terms:
      - 技术攻坚能力
      - 解决方法
      - 编程习惯
      - 细节把控能力
      - 动手能力
      - 目标感
      - 思维清晰
      - 开拓精神
      - 沟通好
      - 创新
      - 吃苦耐劳
      - 守时靠谱

  单字泛词:
    action: drop
    reason: 单独出现无指向（精确匹配，不影响"性能测试""业务流程"这类组合词）
    terms:
      - 业务
      - 开发
      - 测试
      - 设计
      - 系统
      - 分析
      - 学习
      - 网络

  泛指表述:
    action: flag
    reason: 边界模糊，保留但打标，人工抽检决定去留
    terms:
      - 项目管理平台
      - 办公软件
      - 常用工具
      - 相关经验
      - 编程能力
      - 开发经验
      - 电脑操作
      - AI工具
      - 编程语言
      - 测试工作经验
      - 标注经验
      - 团队意识        # 与"团队协作"是否算同一技能，见 alias_map.pending_review

  边界概念:
    action: flag
    reason: 属领域知识或基础素养，可算技能也可不算，取决于分类口径与论文口径
    terms:
      - 点云密度
      - 坐标系
      - 遮挡处理
      - 空间几何认知
      - 目标识别
      - 数据结构
      - 算法
      - 数据安全

